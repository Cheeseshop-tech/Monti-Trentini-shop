<!DOCTYPE html>
<!-- deploy-test: GitHub→Netlify auto-deploy verified 2026-06-03 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monti Trentini — Shop</title>
<link rel="icon" href="../../assets/logo/favicon_192.jpg">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--mt-cream); -webkit-font-smoothing: antialiased; }
  a { cursor: pointer; }
  ::selection { background: var(--mt-mint); }
  svg.lucide { width: 1em; height: 1em; stroke-width: 1.6; display: block; }
  .row-icons span { display: inline-flex; align-items: center; gap: 6px; }
  button { font-family: inherit; }
  /* Cart drawer open/close driven by class. No transition: the preview iframe
     throttles CSS transitions (freezing transform at the start value); instant
     toggle is reliable in every context. */
  .cart-scrim { opacity: 0; pointer-events: none; }
  .cart-scrim.is-open { opacity: 1; pointer-events: auto; }
  .cart-drawer { transform: translateX(105%); }
  .cart-drawer.is-open { transform: translateX(0); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<!-- Trade catalog overlay: replaces STORE_DATA.products with the real 2026-03 USD price list -->
<script type="text/babel" src="trade-data.jsx"></script>
<script type="text/babel" src="store-core.jsx"></script>
<script type="text/babel" src="images.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Catalog.jsx"></script>
<script type="text/babel" src="Cart.jsx"></script>
<script type="text/babel" src="Content.jsx"></script>
<script type="text/babel" src="Wholesale.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="tweaks-shell.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "#009640",
    "announce": "Product of the Mountains \u00B7 Italian Alpine Cheese \u00B7 since 1925",
    "startMode": "retail",
    "showSocial": true
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const cart = window.useCartState();
    const [view, setView] = React.useState("collection");  // open on the Shop page
    const [arg, setArg] = React.useState(null);     // route argument (product/recipe/article id)
    const [wholesale, setWholesale] = React.useState(false);

    const onNav = (v, a) => { setView(v); setArg(a || null); window.scrollTo({ top: 0, behavior: "smooth" }); };
    const toggleWholesale = () => { setWholesale((w) => !w); onNav("wholesale"); };
    const login = () => { setWholesale(true); onNav("wholesale"); };

    React.useEffect(() => {
      document.documentElement.style.setProperty("--accent", t.accent);
      document.documentElement.style.setProperty("--mt-italia-green", t.accent);
    }, [t.accent]);
    React.useEffect(() => { setWholesale(t.startMode === "wholesale"); }, [t.startMode]);
    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    // override announcement text via tweak (retail only)
    window.STORE_ANNOUNCE = t.announce;

    return (
      <window.CartCtx.Provider value={cart}>
        <StoreHeader view={view} onNav={onNav} wholesale={wholesale} />
        {view === "home" && <StoreHome onNav={onNav} wholesale={wholesale} showSocial={t.showSocial} />}
        {view === "collection" && <CollectionPage onNav={onNav} wholesale={wholesale} />}
        {view === "product" && <ProductPage id={arg} onNav={onNav} wholesale={wholesale} />}
        {view === "cart" && <CartPage onNav={onNav} wholesale={wholesale} />}
        {view === "recipes" && <RecipeIndex onNav={onNav} />}
        {view === "recipe" && <RecipeDetail id={arg} onNav={onNav} wholesale={wholesale} />}
        {view === "blog" && <BlogIndex onNav={onNav} />}
        {view === "article" && <BlogArticle id={arg} onNav={onNav} />}
        {view === "social" && <SocialFeed />}
        {view === "wholesale" && <WholesalePage wholesale={wholesale} onLogin={login} onNav={onNav} />}
        <StoreFooter onNav={onNav} onToggleWholesale={toggleWholesale} wholesale={wholesale} />
        <CartDrawer onNav={onNav} wholesale={wholesale} />

        {t.showSocial !== undefined && (
          <TweaksPanel>
            <TweakSection label="Brand" />
            <TweakColor label="Accent" value={t.accent} options={["#009640", "#064E22", "#70C883"]} onChange={(v) => setTweak("accent", v)} />
            <TweakSection label="Store" />
            <TweakRadio label="Start as" value={t.startMode} options={["retail", "wholesale"]} onChange={(v) => setTweak("startMode", v)} />
            <TweakToggle label="Social feed on home" value={t.showSocial} onChange={(v) => setTweak("showSocial", v)} />
            <TweakText label="Announcement" value={t.announce} onChange={(v) => setTweak("announce", v)} />
          </TweaksPanel>
        )}
      </window.CartCtx.Provider>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
